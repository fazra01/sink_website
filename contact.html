<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact Us — The E-Sink</title>

  <style>
    @font-face {
      font-family: "VCR OSD Mono";
      src: url("fonts/VCR_OSD_MONO.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      cursor: url("images/cat-paw-cursor.png") 16 16, auto !important;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: #000;
      font-family: "VCR OSD Mono", monospace;
    }

    /* =========================
       SAME BACKGROUND AS HOME
    ========================== */

    .page-background {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      z-index: 0;
    }

    .page-overlay {
      position: fixed;
      inset: 0;

      background: rgba(255, 255, 255, 0.18);

      z-index: 1;
      pointer-events: none;
    }

    /* =========================
       HOME BUTTON
    ========================== */

    .home-link {
      position: fixed;
      top: 32px;
      left: 32px;
      z-index: 20;

      display: inline-block;
      padding: 16px 24px;

      background: rgba(0, 0, 0, 0.58);
      color: #fff;

      font-family: "VCR OSD Mono", monospace;
      font-size: 34px;
      line-height: 1;
      text-decoration: none;

      clip-path: polygon(
        8px 0,
        calc(100% - 8px) 0,
        calc(100% - 8px) 8px,
        100% 8px,
        100% calc(100% - 8px),
        calc(100% - 8px) calc(100% - 8px),
        calc(100% - 8px) 100%,
        8px 100%,
        8px calc(100% - 8px),
        0 calc(100% - 8px),
        0 8px,
        8px 8px
      );
    }

    /* =========================
       MAIN CONTACT LAYOUT
    ========================== */

    .contact-page {
      position: relative;
      z-index: 2;

      width: min(1500px, calc(100% - 80px));
      height: 100svh;
      margin: 0 auto;

      display: grid;
      grid-template-columns: minmax(430px, 0.9fr) minmax(520px, 0.95fr);
      align-items: center;
      justify-content: center;
      gap: clamp(60px, 7vw, 120px);

      padding: 90px 0 50px;
    }

    /* =========================
       GREEN PLAYER + SINK VIDEO
    ========================== */

    .sink-player {
      position: relative;

      width: min(560px, 42vw);
      aspect-ratio: 342 / 394;

      justify-self: end;
    }

    .sink-screen {
      position: absolute;

      left: 19.59%;
      top: 15.23%;

      width: 61.11%;
      height: 39.34%;

      overflow: hidden;
      background: #000;

      z-index: 1;
    }

    .sink-screen video {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: cover;
    }

    .sink-frame {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
      object-fit: contain;

      z-index: 2;
      pointer-events: none;
    }

    /* =========================
       ACTION BUTTONS
    ========================== */

    .contact-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 42px;

      justify-self: start;
    }

    .contact-button {
      position: relative;

      width: min(620px, 41vw);
      aspect-ratio: 80 / 13;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 48px;

      color: #fff;

      font-family: "VCR OSD Mono", monospace;
      font-size: clamp(24px, 2.15vw, 36px);
      line-height: 1;
      text-align: center;
      text-decoration: none;

      background-image: url("images/pink-button-wide-shorter.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;

      image-rendering: pixelated;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 850px) {
      body {
        overflow-y: auto;
      }

      .home-link {
        top: 16px;
        left: 16px;

        padding: 12px 17px;
        font-size: 24px;
      }

      .contact-page {
        width: min(100% - 32px, 700px);
        height: auto;
        min-height: 100svh;

        grid-template-columns: 1fr;
        gap: 45px;

        padding: 110px 0 70px;
      }

      .sink-player {
        width: min(520px, 90vw);
        justify-self: center;
      }

      .contact-actions {
        width: 100%;
        align-items: center;
        justify-self: center;
        gap: 28px;
      }

      .contact-button {
        width: min(620px, 90vw);
        aspect-ratio: 80 / 13;
        padding: 0 28px;
        font-size: clamp(18px, 4.5vw, 30px);
      }
    }
  </style>
</head>

<body>

  <!-- SAME LOOPING BACKGROUND AS HOMEPAGE -->
  <video
    class="page-background"
    autoplay
    muted
    loop
    playsinline
  >
    <source src="videos/home-background.mp4" type="video/mp4" />
  </video>

  <div class="page-overlay"></div>

  <a class="home-link" href="index.html">Home</a>

  <main class="contact-page">

    <!-- LEFT: GREEN MEDIA PLAYER -->
    <div class="sink-player">

      <div class="sink-screen">
        <video autoplay muted loop playsinline>
          <source src="videos/sink.mov" type="video/mp4" />
        </video>
      </div>

      <img
        class="sink-frame"
        src="images/contact-frame.png"
        alt=""
      />
    </div>


    <!-- RIGHT: ACTION BUTTONS -->
    <nav class="contact-actions" aria-label="Contact options">

      <a class="contact-button" href="https://secure.touchnet.net/C21525_ustores/web/product_detail.jsp?PRODUCTID=1712">
        Gift Card Purchase
      </a>

      <a class="contact-button" href="https://docs.google.com/forms/d/e/1FAIpQLSf8W6MnqYOB0VjfWScUtcu_ps80--iuPTJ9oGQYiB3J2cbqeg/viewform">
        Collab and Space Rental
      </a>

    </nav>

  </main>

</body>
</html>
